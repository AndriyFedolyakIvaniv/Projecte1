<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ question.question_text }}</title>
</head>
<body>
    <h1>{{ question.question_text }}</h1>
    <ul>
    {% for choice in question.choice_set.all %}
        <li>{{ choice.choice_text }}</li>
    {% empty %}
        <li>No choices are available.</li>
    {% endfor %}
    </ul>
    <p><a href="{% url 'web:index' %}">Back to questions</a></p>
</body>
</html>
