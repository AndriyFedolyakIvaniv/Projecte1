<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Questions</title>
</head>
<body>
    <h1>Questions</h1>
    {% if latest_question_list %}
        <ul>
        {% for question in latest_question_list %}
            <li><a href="{% url 'web:detail' question.id %}">{{ question.question_text }}</a></li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No questions are available.</p>
    {% endif %}
</body>
</html>
